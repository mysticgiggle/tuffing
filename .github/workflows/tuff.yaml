name: VS Code Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: windows-2025-vs2026
    timeout-minutes: 3600

    steps:
      - name: Install VS Code (winget CI-safe)
        shell: powershell
        run: |
          # Disable Microsoft Store source to prevent interactive prompts
          winget source disable msstore

          # Install VS Code from winget community repo only
          winget install --id Microsoft.VisualStudioCode `
            --source winget `
            --silent `
            --disable-interactivity `
            --accept-source-agreements `
            --accept-package-agreements

          $codePath = "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"

          if (!(Test-Path $codePath)) {
            Write-Error "VS Code installation failed"
            exit 1
          }

          Write-Host "VS Code installed at: $codePath"

      - name: Start VS Code Tunnel
        shell: powershell
        run: |
          $code = "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"

          Write-Host "Starting VS Code Tunnel..."

          Start-Process -FilePath $code -ArgumentList "tunnel --accept-server-license-terms" -NoNewWindow

          Start-Sleep -Seconds 10

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== VSCODE TUNNEL ==="
          Write-Host "Tunnel process is running..."
          Write-Host "Check VS Code logs for tunnel URL"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] VS Code Tunnel Active - Keep-alive running"
              Start-Sleep -Seconds 300
          }
