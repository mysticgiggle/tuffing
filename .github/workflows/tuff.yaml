name: VS Code Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: windows-2025-vs2026
    timeout-minutes: 3600

    steps:
      - name: Install VS Code (winget)
        shell: powershell
        run: |
          winget install --id Microsoft.VisualStudioCode --silent --disable-interactivity

          $codePath = "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"

          if (!(Test-Path $codePath)) {
            Write-Error "VS Code installation failed"
            exit 1
          }

          Write-Host "VS Code installed at: $codePath"

      - name: Start VS Code Tunnel
        shell: powershell
        run: |
          $code = "$env:LOCALAPPDATA\Programs\Microsoft VS Code\Code.exe"

          Write-Host "Starting VS Code Tunnel..."

          Start-Process -FilePath $code -ArgumentList "tunnel --accept-server-license-terms" -NoNewWindow

          Start-Sleep -Seconds 10

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== VSCODE TUNNEL ==="
          Write-Host "Tunnel process is running..."
          Write-Host "If authenticated, URL will appear in the VS Code output/logs"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Visual Studio Code Tunnel Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
