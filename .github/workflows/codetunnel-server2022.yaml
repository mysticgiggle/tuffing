name: VS Code Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: windows-2022
    timeout-minutes: 3600

    steps:
      - name: Download VS Code CLI
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://vscode.download.prss.microsoft.com/dbazure/download/stable/1b50d58d73426c9171299ec4037d01365d995b78/vscode_cli_win32_x64_cli.zip" `
            -OutFile "$env:TEMP\vscode-cli.zip"

          Expand-Archive `
            -Path "$env:TEMP\vscode-cli.zip" `
            -DestinationPath "$env:TEMP\vscode-cli" `
            -Force

      - name: Start VS Code Tunnel (CLI)
        shell: powershell
        run: |
          $code = "$env:TEMP\vscode-cli\code.exe"

          if (!(Test-Path $code)) {
            Write-Error "VS Code CLI not found"
            exit 1
          }

          Write-Host "Starting VS Code Tunnel..."

          # Run in foreground so tunnel properly initializes
          & $code tunnel --accept-server-license-terms --random-name

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== VSCODE TUNNEL ==="
          Write-Host "Tunnel is running in CLI mode"
          Write-Host "URL will appear in the logs above after authentication"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] VS Code Tunnel Active - Keep-alive running"
              Start-Sleep -Seconds 300
          }
